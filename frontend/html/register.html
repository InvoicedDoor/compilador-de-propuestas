<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/modal.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">

            <div class="login-header">
                <img src="/icons/proposal-manager.png" class="login-logo">
                <h2>Iniciar sesión</h2>
                <p class="subtitle">Accede a tu cuenta</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" id="username" onchange="handleInputMail(event)" required>
                </div>

                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" onchange="handleInputPassword(event)" required>
                </div>

                <button type="submit" class="login-button" onclick="handleLogin(event)">
                    Iniciar sesión
                </button>

            </form>

            <div class="login-footer">
                <p>© Leanovation SA. de CV.</p>
            </div>

        </div>
    </div>
</body>
</html>
