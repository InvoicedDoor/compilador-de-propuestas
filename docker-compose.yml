services:
  mysql:
    image: mysql:8.0
    restart: always
    container_name: "${APP_NAME:-app}-mysql"

    environment:
      MYSQL_ROOT_PASSWORD: "${SET_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_NAME:-db_app}"
      MYSQL_USER: "${DB_USER:-test}"
      MYSQL_PASSWORD: "${DB_PASS:-test}"

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "${DB_PORT}:3306"

    command: mysqld --default-authentication-plugin=mysql_native_password

    networks:
      - proyecto_piloto

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development

    restart: always

    depends_on:
      - mysql

    environment:
      DB_NAME: "${DB_NAME:-db_app}"
      DB_USER: "${DB_USER:-test}"
      DB_PASSWORD: "${DB_PASS:-test}"
      DB_HOST: "${DB_HOST:-localhost}"
      DB_PORT: "${DB_PORT:-3306}:3306"

    container_name: "${APP_NAME:-app}-backend"

    volumes:
      - ./backend:/backend

    ports:
      - "${APP_PORT:-5000}:5000"

    networks:
      - proyecto_piloto

  frontend:
    build:
      context: ./frontend

    restart: always

    container_name: "${APP_NAME:-app}-frontend"

    ports:
      - "80:80"

    working_dir: /usr/share/nginx/html

    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      backend:
        condition: service_started

    networks:
      - proyecto_piloto

volumes:
  mysql_data:
    driver: local

networks:
  proyecto_piloto:
    driver: bridge